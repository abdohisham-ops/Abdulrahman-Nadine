<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Private Wedding Guestbook</title><style>body{font:16px Arial;background:#fbf4ec;color:#4d342d;margin:0;padding:24px}.box{max-width:440px;margin:8vh auto;background:#fffdf8;border:1px solid #d8bd83;padding:28px;box-shadow:0 12px 35px #7653 1}h1{font-family:Georgia,serif;color:#9d7138}input,button{box-sizing:border-box;width:100%;padding:14px;margin-top:12px;font-size:16px}input{border:1px solid #d8bd83}button{border:0;background:#ae8548;color:white;cursor:pointer}p{color:#806b5c;font-size:13px}</style></head><body><div class="box"><h1>Private Guestbook</h1><p>Enter your private password to view all wedding wishes.</p><form method="post" target="_blank" id="adminForm"><input type="hidden" name="action" value="admin"><input type="password" name="password" placeholder="Admin password" required><button type="submit">View messages</button></form></div><script>const ENDPOINT='PASTE_YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE';document.getElementById('adminForm').addEventListener('submit',e=>{if(!/^https:\/\//.test(ENDPOINT)){e.preventDefault();alert('First paste your deployed Apps Script URL into this file.');return;}e.currentTarget.action=ENDPOINT;});</script></body></html>
